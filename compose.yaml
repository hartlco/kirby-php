services:
  php:
    image: ${KIRBY_IMAGE:-ghcr.io/hartlco/kirby-php:0.1.0}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "127.0.0.1:${KIRBY_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${KIRBY_ROOT:?Set KIRBY_ROOT to the absolute path of your Kirby site}
        target: /app/public
        bind:
          create_host_path: false
    environment:
      PHP_THREADS: ${PHP_THREADS:-4}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
